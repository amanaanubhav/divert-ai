# Prometheus for the compose stack (profile "observability").
# api exposes /metrics on :8000; worker and persister replicas on :9100 (DNS A records
# resolve every replica of the compose service).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: divert-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
  - job_name: divert-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
  - job_name: divert-persister
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["persister"]
        type: A
        port: 9100
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
