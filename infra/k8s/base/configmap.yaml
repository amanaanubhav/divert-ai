apiVersion: v1
kind: ConfigMap
metadata:
  name: divert-config
data:
  DIVERT_ENV: prod
  DIVERT_LOG_LEVEL: INFO
  DIVERT_LOG_JSON: "true"
  DIVERT_CITIES: delhi,kolkata,bengaluru
  DIVERT_OSRM_URL: http://osrm.divert.svc.cluster.local:5000
  DIVERT_CORS_ORIGINS: https://divert.example.org
  DIVERT_CORRIDOR_M: "30"
  DIVERT_PREEMPT_MAX_LEAD_S: "90"
  DIVERT_SIM_TICK_S: "0.5"
  DIVERT_SIM_TIME_SCALE: "1"
  DIVERT_POSITION_RETENTION_DAYS: "30"
  DIVERT_DB_POOL_SIZE: "10"
  DIVERT_PREEMPT_MIN_CLAIM_DISTANCE_M: "150"
  DIVERT_PREEMPT_MAX_HOLD_S: "60"
  DIVERT_PREEMPT_RECOVERY_S: "20"
  DIVERT_PRIORITY_WINDOW_S: "10"
  DIVERT_ROUTE_ALTERNATIVES: "3"
  DIVERT_ROUTE_DETOURS: "2"
  DIVERT_SCENE_TIME_AMBULANCE_S: "480"
  DIVERT_SCENE_TIME_FIRE_ENGINE_S: "1200"
  DIVERT_SCENE_TIME_POLICE_S: "600"
  DIVERT_HOSPITAL_HANDOVER_S: "600"
  DIVERT_LEG_PLAN_BACKOFF_S: "2"
  DIVERT_LEG_PLAN_BACKOFF_MAX_S: "60"
  DIVERT_HOSPITAL_CANDIDATES: "6"
  DIVERT_REROUTE_MIN_SAVING_S: "60"
  DIVERT_REROUTE_MAX_PER_LEG: "2"
  DIVERT_REROUTE_BEHIND_SHARE: "0.25"
  DIVERT_REROUTE_BEHIND_S: "60"
  DIVERT_LEADER_LOCK_TTL_MS: "5000"
  DIVERT_HEARTBEAT_MAX_AGE_S: "10"
  DIVERT_PERSISTER_BATCH: "200"
  DIVERT_PERSISTER_MAX_RETRIES: "5"
  DIVERT_OUTBOX_RELAY_INTERVAL_S: "2"
  DIVERT_RATE_LIMIT_PER_MIN: "120"
  DIVERT_TRUST_PROXY_HEADERS: "true"
  DIVERT_OSRM_TIMEOUT_S: "5"
  DIVERT_OSRM_CACHE_TTL_S: "3600"
  DIVERT_REDIS_REQUEST_TIMEOUT_S: "0.5"
  DIVERT_REDIS_CIRCUIT_COOLDOWN_S: "5"
