apiVersion: apps/v1
kind: Deployment
metadata:
  name: divert-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: divert-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: divert-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: divert-api }
      containers:
        - name: api
          image: divert-backend
          args:
            - uvicorn
            - divert.main:create_app
            - --factory
            - --host=0.0.0.0
            - --port=8000
            - --proxy-headers
            - --forwarded-allow-ips=*
            - --no-access-log
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: divert-config }
            - secretRef: { name: divert-secrets }
          # /readyz = PostgreSQL only (Redis/worker problems report `degraded` but keep the
          # pod in rotation: dispatch still works through the outbox while Redis is down)
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: divert-api
spec:
  selector: { app.kubernetes.io/name: divert-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: divert-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: divert-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: divert-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: divert-api }
