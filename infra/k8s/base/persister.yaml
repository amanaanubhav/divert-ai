# Scales horizontally through the Redis consumer group on divert:history.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: divert-persister
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: divert-persister }
  template:
    metadata:
      labels: { app.kubernetes.io/name: divert-persister }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: persister
          image: divert-backend
          args: ["python", "-m", "divert.persister"]
          ports:
            - { name: metrics, containerPort: 9100 }
          envFrom:
            - configMapRef: { name: divert-config }
            - secretRef: { name: divert-secrets }
          env:
            - { name: DIVERT_METRICS_PORT, value: "9100" }
            - name: DIVERT_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          startupProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: divert-persister
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: divert-persister }
