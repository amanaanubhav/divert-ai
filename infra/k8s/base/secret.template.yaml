# TEMPLATE ONLY - not referenced by kustomization.yaml. Fill in and apply out of band,
# or (preferred) source these keys from your secret manager via External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: divert-secrets
  namespace: divert
type: Opaque
stringData:
  # managed PostgreSQL 16 with PostGIS 3.4 (TLS required in prod)
  DIVERT_DATABASE_URL: postgresql+asyncpg://divert:CHANGE_ME@pg.internal:5432/divert?ssl=require
  # managed Redis 7 with AOF persistence (TLS: rediss://)
  DIVERT_REDIS_URL: rediss://:CHANGE_ME@redis.internal:6380/0
  # optional; enables X-API-Key on mutating endpoints
  DIVERT_API_KEY: CHANGE_ME
