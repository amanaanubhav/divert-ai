# Base manifests for DIVERT. Overlays (staging/prod) set images, replicas, hosts and
# the managed PostgreSQL/Redis endpoints. Secrets are NOT part of the base: create
# `divert-secrets` from secret.template.yaml (or External Secrets / Sealed Secrets).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: divert
labels:
  - pairs:
      app.kubernetes.io/part-of: divert
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - persister.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: divert-backend
    newName: ghcr.io/example/divert-backend
    newTag: "2.0.0"
  - name: divert-frontend
    newName: ghcr.io/example/divert-frontend
    newTag: "2.0.0"
