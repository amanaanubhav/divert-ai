name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # weekly: public OSRM smoke test (fair use: 3 requests)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.12"

jobs:
  backend-lint:
    name: backend - lint, format, types, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests scripts
      - name: ruff format
        run: uv run ruff format --check src tests scripts
      - name: mypy --strict
        run: uv run mypy
      - name: unit tests
        run: uv run pytest tests/unit

  backend-integration:
    name: backend - integration (PostGIS + Redis) + migrations
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: divert
          POSTGRES_PASSWORD: divert
          POSTGRES_DB: divert
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U divert -d divert"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DIVERT_DATABASE_URL: postgresql+asyncpg://divert:divert@localhost:5432/divert
      DIVERT_TEST_DATABASE_URL: postgresql+asyncpg://divert:divert@localhost:5432/divert_test
      DIVERT_TEST_REDIS_URL: redis://localhost:6379/15
      DIVERT_LOG_JSON: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: alembic upgrade head + seed (the migrate job)
        run: uv run divert migrate
      - name: alembic upgrade is idempotent at head
        run: uv run alembic upgrade head && uv run alembic check
      - name: integration tests (PostGIS + Redis service containers)
        run: uv run pytest -m integration tests/integration
      - name: downgrade to base and back (migrations are reversible)
        run: uv run alembic downgrade base && uv run alembic upgrade head

  backend-network:
    name: backend - public OSRM smoke (scheduled / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest -m network tests/network -s

  frontend:
    name: frontend - lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker images
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: divert-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: divert-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
