# DIVERT local / single-host stack.
#
#   docker compose up -d --build               # postgres, redis, migrate, api, worker x2, persister, frontend
#   docker compose up -d postgres redis        # just the data stores (backend dev / tests)
#   docker compose --profile osrm up -d osrm   # self-hosted OSRM (see infra/osrm/README.md)
#   docker compose --profile observability up -d   # prometheus + grafana (http://localhost:3000)
#
# Config comes from .env (copy .env.example). Nothing secret is committed.
name: divert

x-backend-env: &backend-env
  DIVERT_ENV: ${DIVERT_ENV:-dev}
  DIVERT_LOG_LEVEL: ${DIVERT_LOG_LEVEL:-INFO}
  DIVERT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-divert}:${POSTGRES_PASSWORD:-divert}@postgres:5432/${POSTGRES_DB:-divert}
  DIVERT_REDIS_URL: redis://redis:6379/0
  DIVERT_OSRM_URL: ${DIVERT_OSRM_URL:-https://router.project-osrm.org}
  DIVERT_CORS_ORIGINS: ${DIVERT_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  DIVERT_API_KEY: ${DIVERT_API_KEY:-}
  DIVERT_SIM_TIME_SCALE: ${DIVERT_SIM_TIME_SCALE:-1}
  DIVERT_RATE_LIMIT_PER_MIN: ${DIVERT_RATE_LIMIT_PER_MIN:-60}
  DIVERT_METRICS_PORT: "9100"

x-backend: &backend
  image: ${DIVERT_BACKEND_IMAGE:-divert-backend}:${DIVERT_TAG:-dev}
  build:
    context: ./backend
  environment: *backend-env
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-divert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divert}
      POSTGRES_DB: ${POSTGRES_DB:-divert}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    ports:
      - "${DIVERT_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  redis:
    image: redis:7-alpine
    # AOF (fsync every second). noeviction: live state + streams must never be evicted;
    # caches set their own TTLs.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "${DIVERT_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 640m }

  # One-off: alembic upgrade head + idempotent reference-data seed.
  migrate:
    <<: *backend
    command: ["divert", "migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  # ---- application services (one image, several entrypoints)
  api:
    <<: *backend
    command: ["uvicorn", "divert.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    ports:
      - "${DIVERT_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  # Simulation: one leader (Redis lock) + one hot standby. Only the leader writes live state.
  worker:
    <<: *backend
    command: ["python", "-m", "divert.worker"]
    stop_grace_period: 15s
    healthcheck: &metrics-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1", memory: 512m }

  # History writer: scales through the Redis consumer group on divert:history.
  persister:
    <<: *backend
    command: ["python", "-m", "divert.persister"]
    stop_grace_period: 20s
    healthcheck: *metrics-health
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1", memory: 384m }

  # nginx serving the built SPA on :8080 and proxying /api (incl. WebSocket) to the api.
  frontend:
    image: ${DIVERT_FRONTEND_IMAGE:-divert-frontend}:${DIVERT_TAG:-dev}
    build:
      context: ./frontend
      args:
        # basemap (build time; empty = OpenStreetMap standard tiles, dev/demo use only)
        VITE_TILE_URL: ${DIVERT_WEB_TILE_URL:-}
        VITE_TILE_URL_DARK: ${DIVERT_WEB_TILE_URL_DARK:-}
        VITE_TILE_ATTRIBUTION: ${DIVERT_WEB_TILE_ATTRIBUTION:-}
    environment:
      # rendered into nginx's config at start; re-resolved every 10 s (follows a recreated
      # api container and spreads load over `--scale api=N` replicas)
      DIVERT_API_UPSTREAM: api:8000
    ports:
      - "${DIVERT_WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy, restart: true }
    healthcheck:
      # through the proxy: a broken nginx -> api path makes the frontend unhealthy
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }

  # ---- self-hosted routing (prepare data first: infra/osrm/prepare.sh)
  osrm:
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/divert-cities.osrm"]
    volumes:
      - ./infra/osrm/data:/data:ro
    ports:
      - "${DIVERT_OSRM_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:5000/nearest/v1/driving/77.209,28.6139' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 4g }

  # ---- observability
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "${DIVERT_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "${DIVERT_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  prometheus:
  grafana:
